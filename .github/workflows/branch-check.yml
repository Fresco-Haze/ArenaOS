name: branch-check
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the api image (nothing is pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          load: true
          push: false
          tags: arenaos-api:ci
          cache-from: type=gha,scope=api
      - name: CA certificates are in the image
        run: docker run --rm --entrypoint sh arenaos-api:ci -c 'test -s /etc/ssl/certs/ca-certificates.crt'
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 3000:3000 arenaos-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1
