name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SOURCE_URL: https://github.com/Fresco-Haze/ArenaOS

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          load: true
          push: false
          tags: arenaos-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 3000:3000 arenaos-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/fresco-haze/arenaos-api:latest
            ghcr.io/fresco-haze/arenaos-api:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ env.SOURCE_URL }}
          cache-from: type=gha,scope=api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ghcr.io/fresco-haze/arenaos-web:latest
            ghcr.io/fresco-haze/arenaos-web:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ env.SOURCE_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web